# gitleaks: default secret rules plus a few NC-OS extras.
[extend]
useDefault = true

[[rules]]
id = "windows-user-path"
description = "A real Windows home folder path"
regex = '''(?i)[a-z]:\\users\\[a-z0-9._-]+'''

[[rules]]
id = "private-ipv4"
description = "A private LAN IPv4 address"
regex = '''\b(?:10\.(?:\d{1,3}\.){2}\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''

[[rules]]
id = "mac-address"
description = "A hardware MAC address"
regex = '''\b(?:[0-9a-fA-F]{2}[:-]){5}[0-9a-fA-F]{2}\b'''

[[rules]]
id = "uk-postcode"
description = "A UK postcode"
regex = '''\b[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}\b'''
